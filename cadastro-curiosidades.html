<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Curiosidade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🌍 Curiosidades Mundiais</div>
        <ul class="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="paises.html">Países</a></li>
            <li><a href="curiosidades.html">Curiosidades</a></li>
            <li><a href="cadastro.html">Cadastrar Curiosidade</a></li>
        </ul>
    </nav>

    <main class="container">
        <h1>Cadastrar Nova Curiosidade</h1>
        <form id="curiosidadeForm" class="form">
            <div class="form-group">
                <label for="pais">País:</label>
                <select id="pais" name="pais" required>
                    <option value="">Selecione um país</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="categoria">Categoria:</label>
                <select id="categoria" name="categoria" required>
                    <option value="">Selecione uma categoria</option>
                    <option value="cultura">Cultura</option>
                    <option value="historia">História</option>
                    <option value="geografia">Geografia</option>
                    <option value="gastronomia">Gastronomia</option>
                    <option value="turismo">Turismo</option>
                    <option value="outros">Outros</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="titulo">Título:</label>
                <input type="text" id="titulo" name="titulo" required>
            </div>
            
            <div class="form-group">
                <label for="descricao">Descrição:</label>
                <textarea id="descricao" name="descricao" rows="5" required></textarea>
            </div>
            
            <div class="form-group">
                <label for="fonte">Fonte:</label>
                <input type="text" id="fonte" name="fonte" placeholder="Opcional">
            </div>
            
            <button type="submit" class="btn-primary">Cadastrar Curiosidade</button>
        </form>
    </main>

    <script src="js/curiosidades.js"></script>
</body>
</html>
